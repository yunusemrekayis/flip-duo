name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > flipduo.jks
            printf 'storeFile=flipduo.jks\nstorePassword=%s\nkeyAlias=flipduo\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullRelease assembleLiteRelease

      - name: Collect APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir out
          cp app/build/outputs/apk/full/release/*.apk "out/FlipDuo-$VERSION.apk"
          cp app/build/outputs/apk/lite/release/*.apk "out/FlipDuo-$VERSION-lite.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FlipDuo-${{ env.VERSION }}
          path: out/*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION-b$GITHUB_RUN_NUMBER"
          gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --latest \
            --title "Flip Duo $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "Galaxy Z Flip için Duo animasyonu. Telefona FlipDuo-$VERSION.apk dosyasını indirip kurun (Lite = sadece duvar kağıdı)."
